<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>산도장</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="산도장">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#d6e9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a2c3c" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180-v1.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-v1.png">
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" onerror="void 0"></script>
<style>
/* ═══ app-kit.css — 모바일 웹앱 공통 (화면 채우기 · 로딩 · 스와이프 · 시트) ═══
   색은 :root 의 토큰만 바꿔서 앱마다 맞춘다. --solid 는 탭바/하단 띠 색이며 html 배경과 같아야 한다. */
:root{
  --bg:#f3f5f8; --solid:#ffffff; --ink:#12151c; --muted:#6b7280; --line:rgba(18,21,28,.10);
  --accent:#3b6cf6; --danger:#e5484d;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#10141b; --solid:#171c25; --ink:#f2f4f8; --muted:#9aa3b2; --line:rgba(255,255,255,.12); color-scheme:dark; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ── 1. 화면 채우기 (위아래 공백 제거) ──
   · html 배경 = 하단 띠 색(--solid): 아이폰이 그리지 않는 맨 아래 칸이 탭바와 이어져 보인다.
   · 문서는 스크롤하지 않고(#sc 만 스크롤) 탭바는 fixed 가 아닌 flex 맨 아래 칸에 둔다.
   · --app-h 는 app-kit.js 의 fixViewport() 가 실제 화면 높이로 넣어 준다. */
html{height:100%;background:var(--solid);overflow:hidden}
body{margin:0;height:var(--app-h,100%);overflow:hidden;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);overscroll-behavior:none;-webkit-text-size-adjust:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.ak-top{flex:none;display:flex;align-items:center;gap:8px;background:var(--bg);
  padding:calc(8px + var(--sat)) max(16px,var(--sar)) 8px max(16px,var(--sal))}
.ak-top h1{flex:1;margin:0;font-size:20px;font-weight:800}
#sc{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  padding:4px max(16px,var(--sar)) 20px max(16px,var(--sal))}
.ak-tabs{flex:none;display:flex;background:var(--solid);border-top:1px solid var(--line);
  padding:6px max(8px,var(--sar)) max(6px,calc(var(--sab) - 14px)) max(8px,var(--sal))}
.ak-tabs button{flex:1;border:0;background:none;font:inherit;font-size:11px;font-weight:600;color:var(--muted);
  padding:6px 0;display:grid;gap:2px;justify-items:center;cursor:pointer}
.ak-tabs button .i{font-size:20px;line-height:1}
.ak-tabs button.on{color:var(--accent)}
/* 아이폰은 16px 보다 작은 입력칸을 누르면 화면을 확대한다 */
input,select,textarea{font-size:16px}
/* 키보드가 올라와 있는 동안 아래 여백 (AppKit.keyboardSafe) */
body.kb #sc{padding-bottom:50vh}
button{touch-action:manipulation}

/* ── 2. 로딩 ── */
/* 2-1 첫 화면: JS 가 뜨기 전부터 보이는 아이콘 + 문구 */
.ak-boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);text-align:center;transition:opacity .25s}
.ak-boot.out{opacity:0;pointer-events:none}
.ak-boot img{width:84px;height:84px;border-radius:20px;animation:ak-breathe 1.6s ease-in-out infinite}
.ak-boot p{margin:14px 0 0;color:var(--muted);font-size:14px}
@keyframes ak-breathe{50%{transform:scale(.94);opacity:.75}}
/* 2-2 누른 동작 처리 중: 위쪽 진행 막대 + 알약 + 누른 버튼 스피너 */
.ak-bar{position:fixed;left:0;right:0;top:0;height:3px;z-index:60;pointer-events:none;opacity:0;transition:opacity .2s;overflow:hidden;
  background:color-mix(in srgb,var(--accent) 18%,transparent)}
.ak-bar.on{opacity:1}
.ak-bar::before{content:"";position:absolute;top:0;bottom:0;width:40%;left:-40%;border-radius:3px;background:var(--accent);animation:ak-bar 1.1s ease-in-out infinite}
@keyframes ak-bar{to{left:100%}}
.ak-pill,.ak-toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));z-index:61;transform:translate(-50%,12px);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:600;
  padding:9px 16px;border-radius:999px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 6px 24px rgba(0,0,0,.22)}
.ak-pill{display:flex;align-items:center;gap:8px}
.ak-pill.on,.ak-toast.on{opacity:1;transform:translate(-50%,0)}
.ak-pill.top{top:calc(14px + var(--sat));bottom:auto}
.ak-pill .e{display:inline-block;animation:ak-hop .5s ease-in-out infinite alternate}
@keyframes ak-hop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-4px) rotate(6deg)}}
.ak-pill .d i{display:inline-block;width:4px;height:4px;margin-left:3px;border-radius:50%;background:currentColor;animation:ak-dot 1.2s infinite}
.ak-pill .d i:nth-child(2){animation-delay:.2s}.ak-pill .d i:nth-child(3){animation-delay:.4s}
@keyframes ak-dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.is-busy{position:relative;pointer-events:none;opacity:.6}
.is-busy::after{content:"";position:absolute;right:12px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;
  border:2px solid currentColor;border-right-color:transparent;animation:ak-spin .7s linear infinite}
/* 2-3 배경 새로고침: 새로고침 아이콘만 돈다 */
.ak-icon-btn{border:0;background:none;color:inherit;font-size:20px;width:40px;height:40px;border-radius:50%;cursor:pointer;display:inline-grid;place-items:center;padding:0}
/* 아이콘만 정확히 가운데 축으로 돈다 (버튼째 돌리면 꿀렁거림) */
.ak-icon-btn svg{display:block;transform-origin:50% 50%;will-change:transform}
.ak-spin{animation:ak-spin .8s linear infinite}
@keyframes ak-spin{to{transform:rotate(360deg)}}

/* ── 3. 스와이프 ── */
.ak-in-l{animation:ak-in-l .22s ease-out}.ak-in-r{animation:ak-in-r .22s ease-out}
@keyframes ak-in-l{from{transform:translateX(28px);opacity:0}}
@keyframes ak-in-r{from{transform:translateX(-28px);opacity:0}}
.ak-hscroll{overflow-x:auto;scrollbar-width:none;touch-action:pan-x;overscroll-behavior:contain}
.ak-hscroll::-webkit-scrollbar{display:none}

/* ── 4. 바텀시트 (끌어서 열고 닫기) ── */
.ak-scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s}
.ak-scrim.on{opacity:1;pointer-events:auto}
.ak-sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  background:var(--solid);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  padding:0 max(18px,var(--sar)) calc(18px + var(--sab)) max(18px,var(--sal))}
.ak-sheet.on{transform:translateY(0)}
.ak-sheet.dragging{transition:none}
/* 시트 아래로 같은 색을 이어 붙여 아이폰 하단 틈을 가린다 */
.ak-sheet::after{content:"";position:absolute;left:0;right:0;top:calc(100% - 1px);height:200px;background:var(--solid)}
.ak-grab{flex:none;padding:8px 0 12px;touch-action:none;cursor:grab}
.ak-grab::before{content:"";display:block;width:40px;height:5px;border-radius:9px;margin:0 auto;background:color-mix(in srgb,var(--ink) 18%,transparent)}
.ak-sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

@media (prefers-reduced-motion:reduce){
  .ak-bar::before,.ak-pill .e,.ak-pill .d i,.is-busy::after,.ak-spin,.ak-boot img{animation-duration:2.5s}
  .ak-in-l,.ak-in-r{animation:none}.ak-sheet,.ak-scrim{transition:none}
}

/* ── 5. 상태·오류·예시 표시 ── */
/* 숫자는 자릿수가 흔들리지 않게 */
.num{font-variant-numeric:tabular-nums}
/* 갱신 상태: <span class="ak-status"><i class="ak-dot live"></i>14:32 갱신</span> */
.ak-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.ak-dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.ak-dot.live{background:#22c55e;animation:ak-pulse 1.8s infinite}
.ak-dot.off{background:var(--danger)}
@keyframes ak-pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 6px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
/* 예시 데이터로 보는 중 */
.ak-demo{flex:none;background:var(--ink);color:var(--bg);text-align:center;font-size:12.5px;padding:calc(6px + var(--sat)) 6px 6px}
.ak-demo:not([hidden]) + .ak-top{padding-top:8px}
/* 앱 오류 */
.ak-err{flex:none;background:var(--danger);color:#fff;font-size:12.5px;line-height:1.4;padding:calc(6px + var(--sat)) 12px 6px;overflow-wrap:anywhere}
/* 빈 화면·불러오기 실패 */
.ak-empty{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;padding:36px 16px}
/* 설명 글은 가운데 정렬 + 낱말 중간에서 끊지 않기(한글 기본값은 글자 단위로 끊긴다) + 줄 길이 고르게.
   칸보다 긴 낱말(주소·코드)만 그 안에서 끊는다. 손으로 <br>을 넣어 맞추지 않는다 */
.ak-center,.note,.ak-empty,.ak-demo{word-break:keep-all;overflow-wrap:break-word;text-wrap:balance}
.ak-center,.note{text-align:center}
.ak-empty button{margin-top:12px;border:1px solid var(--line);background:var(--solid);color:var(--ink);font:inherit;font-weight:600;border-radius:10px;padding:8px 16px}
/* 선 아이콘: <svg class="ak-ic" viewBox="0 0 24 24"><path …/></svg> — 글자색을 따라간다 */
.ak-ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.ak-dot.live{animation:none}}
/* ── 색: 파스텔 '하늘'(A) 기본, 숲(F)은 시안용 ── */
:root{ --bg:#f3f8fc; --top-bg:#d6e9f7; --top-ink:#1f4d70; --accent:#4f93c9; --on-accent:#fff; --chip:#e9f2fa; --title:#2a6fa8;
  --land:#e3eef7; --land-line:#bcd5ea; --sea:#f7fbfe;
  --p-go:#dff3e4; --p-go-ink:#1f6b35; --p-warn:#fdf0d5; --p-warn-ink:#8a5a00; --p-stop:#fde2e2; --p-stop-ink:#a12d2d; --p-violet:#ece6fb; --p-violet-ink:#5b3fa8; }
@media (prefers-color-scheme:dark){ :root{ --bg:#0f1a24; --solid:#152230; --top-bg:#1a2c3c; --top-ink:#cfe5f6; --accent:#8cc2ea; --on-accent:#0d2436; --chip:#1c2e3e; --title:#9fcdf0;
  --land:#1d3142; --land-line:#2c4a63; --sea:#122130;
  --p-go:#183a24; --p-go-ink:#9fe0b0; --p-warn:#3d2f12; --p-warn-ink:#f3cf86; --p-stop:#3f1d1d; --p-stop-ink:#f5aaaa; --p-violet:#2a2342; --p-violet-ink:#c9b8f7; } }

.ak-top{background:var(--top-bg);color:var(--top-ink);padding-bottom:10px}
.ak-top h1{font-size:21px;letter-spacing:-.02em}
.ak-top .ak-status{color:inherit;opacity:.75}
.bell{position:relative}
.bell em{position:absolute;top:4px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font:700 10px/17px system-ui;font-style:normal;text-align:center;padding:0 4px}
#sc{padding-top:12px}
.ak-tabs button.on{color:var(--accent)}
.ak-ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ak-tabs .ak-ic{width:24px;height:24px}

.card{background:var(--solid);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:0 0 12px}
.sec{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;font-size:15px;font-weight:800}
.sec small{margin-left:auto;font-weight:600;color:var(--muted);font-size:12px}
.sec::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--accent)}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:12.5px;line-height:1.55;margin:8px 4px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:46px;border:0;border-radius:13px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;font-size:15px;padding:10px 14px;cursor:pointer}
.btn.ghost{background:var(--solid);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:38px;font-size:13.5px;border-radius:11px;width:auto;padding:6px 12px}
.btn .sub{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:0;border-radius:999px;background:var(--chip);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:7px 13px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--on-accent)}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:13.5px;font-weight:700;color:var(--muted);padding:8px 0;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--solid);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tag{display:inline-flex;align-items:center;gap:3px;border-radius:7px;padding:2px 7px;font-size:11.5px;font-weight:700;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.go{background:var(--p-go);color:var(--p-go-ink)}.tag.warn{background:var(--p-warn);color:var(--p-warn-ink)}
.tag.vio{background:var(--p-violet);color:var(--p-violet-ink)}.tag.dd{background:var(--accent);color:var(--on-accent)}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--c,#999);color:#fff;font-size:13px;font-weight:800;font-style:normal;border:2px solid var(--solid);flex:none;letter-spacing:-.04em}
.avs{display:inline-flex}.avs .av+.av{margin-left:-8px}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}

/* 정복 지도(그림 지도) — 외부 지도 없이 바로 그려지는 우리나라 윤곽 */
.krmap{display:block;width:100%;height:auto}
.krmap .land{fill:var(--land);stroke:var(--land-line);stroke-width:1.5}
.krmap .d0{fill:var(--muted);opacity:.35}
.krmap .d1{fill:var(--solid);stroke:var(--accent);stroke-width:3}
.krmap .d2{fill:var(--accent);stroke:var(--solid);stroke-width:3}
.krmap .nx{fill:#e8833a;stroke:var(--solid);stroke-width:3}
.krmap text{font:700 15px system-ui;fill:var(--ink);paint-order:stroke;stroke:var(--solid);stroke-width:4px}
.legend{display:flex;justify-content:center;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}

/* 홈 A */
.hero{position:relative;padding:10px 12px 10px;background:linear-gradient(180deg,var(--sea),var(--solid))}
.hero .krmap{max-height:300px;margin:0 auto;width:auto}
.hero-t{position:absolute;left:16px;top:14px;font-size:13px;font-weight:700;color:var(--muted);line-height:1.5}
.hero-t b{display:block;font-size:30px;color:var(--title);line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.stat{background:var(--solid);border:1px solid var(--line);border-radius:15px;padding:11px 8px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--title);letter-spacing:-.03em}
.stat b small{font-size:13px;color:var(--muted);font-weight:700}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.trip{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.trip .tl{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.trip h4{margin:0 0 3px;font-size:17px;color:var(--title)}
.trip .meta{font-size:13px;color:var(--muted);margin-bottom:10px}
.trip .pg{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted);background:var(--chip);border-radius:12px;padding:9px 11px}
.trip .pg b{color:var(--ink);font-size:12.5px}
.feed{padding:4px 14px}
.fi{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.fi:last-child{border-bottom:0}
.fi .t{flex:1;min-width:0;font-size:14px;line-height:1.35}
.fi .t b{font-weight:700}.fi .t small{display:block;color:var(--muted);font-size:12px}
.fi img{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}

/* 사진 격자 */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:14px;overflow:hidden}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer;background:var(--chip)}


/* 산 목록 */
.mapbox{position:relative;height:260px;border-radius:18px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;background:var(--sea)}
.mapbox .krmap{height:100%;width:auto;margin:0 auto}
.mapbox .mk-canvas{position:absolute;inset:0}
.mk-tools{position:absolute;right:8px;top:8px;z-index:500;display:grid;gap:4px}
.mk-tools button{width:36px;height:36px;border:0;border-radius:10px;background:var(--solid);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15);font:700 16px system-ui;display:grid;place-items:center}
.mk-tools button.txt{font-size:11px}
.mpin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;white-space:nowrap}
.mpin i{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.mpin.f i{background:#fff;border-color:var(--accent)}.mpin.n i{width:9px;height:9px;background:#8a96a3}
.mpin b{font-size:11px;background:rgba(255,255,255,.9);color:#12151c;border-radius:5px;padding:1px 4px}
.medot{width:16px;height:16px;border-radius:50%;background:#2f80ed;border:3px solid #fff;transform:translate(-50%,-50%);box-shadow:0 0 0 6px rgba(47,128,237,.25)}
.mt{display:flex;gap:12px;align-items:center;cursor:pointer}

<script>
/* ═══ app-kit.js — 모바일 웹앱 공통 동작 ═══
   AppKit.fixViewport({gap})       화면 높이 보정 (아이폰 홈 화면 앱 위아래 공백 제거). 탭바가 화면 아래로 잘리면 {gap:false}
   AppKit.bootDone()               첫 로딩 화면 걷기
   AppKit.track(promise, opts)     진행 막대 + 알약 + 누른 버튼 스피너
   AppKit.wrap(fn, skip)           API 함수를 감싸 "방금 누른 동작"만 자동으로 진행 표시
   AppKit.spin(el, promise)        새로고침 아이콘 돌리기 (아이콘만 가운데 축으로, 멈출 땐 한 바퀴 마저 돌고 0도에서)
   AppKit.keyboardSafe()           입력칸을 누르면 키보드에 가리지 않게 여백 + 가운데로
   AppKit.toast(msg)               짧은 알림
   AppKit.swipe(el, {onNext,onPrev})  좌우 스와이프 (탭·날짜 넘기기)
   AppKit.tabs({...})              탭바 + 스와이프 + 넘김 애니메이션
   AppKit.sheet(el)                바텀시트 열기/닫기 + 끌어내려 닫기
   AppKit.autoUpdate(build)        version.txt 가 바뀌면 새 버전으로 다시 열기
   AppKit.env()                    진단 문구 (버전·홈 화면 앱 여부·화면 크기)
   AppKit.store('앱접두어')         localStorage 를 안전하게 (get/set/del)
   AppKit.esc / num / krw / signed / kstDate / addDays / hhmm   글자·숫자·날짜
   AppKit.poll(fn, ms, busy)       화면이 보일 때만 자동 새로고침 + 돌아오면 즉시
   AppKit.editing(view)            입력 중인지 (배경 새로고침이 입력값을 지우지 않게)
   AppKit.sequence()               늦게 온 예전 응답 버리기
   AppKit.showErrors(build)        앱 오류를 화면에 표시
   AppKit.sure(btn)                두 번 눌러야 지워지는 버튼
   AppKit.copy(text) / buzz()      복사 · 진동
   AppKit.toJpeg(file, maxSide)    사진 줄여서 올리기
   AppKit.device()                 접속 기록용 기기·방식 */
const AppKit = (() => {
  const $ = s => typeof s === 'string' ? document.querySelector(s) : s;
  const root = document.documentElement;
  const standalone = () => !!navigator.standalone || matchMedia('(display-mode: standalone)').matches;

  /* ── 1. 화면 높이 ──
     아이폰 홈 화면 앱은 웹 화면(innerHeight)을 실제 화면보다 짧게 잡을 때가 있다.
     그 차이(gap)만큼 문서 높이를 늘려 맨 아래 빈 띠를 없앤다. 가로 모드·브라우저에서는 보정하지 않는다. */
  let gap = 0;
  /* 주의(개찰알림 2026-11, iOS 홈 화면 앱·상태바 default): raw 가 상태바 높이만큼 잡혀 문서가 화면보다 길어지고
     탭바가 화면 아래로 잘렸다. 그런 기기에서는 fixViewport({ gap:false }) 로 보정을 끈다(남는 띠는 html 배경=탭바 색이라 이어져 보인다). */
  function fixViewport({ gap: useGap = true } = {}) {
    const set = () => {
      const portraitH = Math.max(screen.height, screen.width);
      const raw = innerHeight < innerWidth ? 0 : portraitH - innerHeight;
      gap = useGap && standalone() && raw > 0 && raw < 160 ? raw : 0;
      root.style.setProperty('--app-h', (innerHeight + gap) + 'px');
      root.classList.toggle('standalone', standalone());
    };
    set();
    addEventListener('resize', set);
    addEventListener('orientationchange', () => setTimeout(set, 300));
  }

  /* ── 2. 로딩 ── */
  function bootDone() { const b = $('.ak-boot'); if (!b) return; b.classList.add('out'); setTimeout(() => b.remove(), 300); }

  let tapAt = 0, tapEl = null, busyN = 0, pillTm = 0, busyLabel = '잠깐만요, 처리 중이에요', busyEmoji = '⏳';
  ['pointerdown', 'change'].forEach(t => document.addEventListener(t, e => {
    tapAt = Date.now();
    if (t === 'pointerdown') tapEl = e.target.closest?.('button,label,.btn,[role=button]') || null;
  }, true));
  function busyUI(on, label) {
    let bar = $('.ak-bar'), pill = $('.ak-pill');
    if (on) {
      if (!bar) { bar = document.createElement('div'); bar.className = 'ak-bar'; document.body.appendChild(bar); }
      if (!pill) { pill = document.createElement('div'); pill.className = 'ak-pill'; pill.setAttribute('role', 'status'); document.body.appendChild(pill); }
      pill.innerHTML = `<span class="e">${busyEmoji}</span><span></span><span class="d"><i></i><i></i><i></i></span>`;
      pill.children[1].textContent = label || busyLabel;
      pill.classList.toggle('top', !!$('.ak-sheet.on'));           // 시트가 열려 있으면 버튼을 가리지 않게 위로
      requestAnimationFrame(() => bar.classList.add('on'));
      clearTimeout(pillTm); pillTm = setTimeout(() => pill.classList.add('on'), 350);   // 금방 끝나면 알약은 안 띄움
    } else {
      clearTimeout(pillTm); bar?.classList.remove('on'); pill?.classList.remove('on');
      document.querySelectorAll('.is-busy').forEach(x => x.classList.remove('is-busy'));
    }
  }
  function track(p, { el, label } = {}) {
    busyN++; const b = $(el) || tapEl; if (b && document.contains(b)) b.classList.add('is-busy'); busyUI(true, label);
    const done = () => { if (--busyN <= 0) { busyN = 0; busyUI(false); } };
    p.then(done, done); return p;
  }
  /* 사용자가 누른 지 1.5초 안에 시작된 요청만 표시한다. 배경 새로고침은 조용히. */
  function wrap(fn, skip) {
    return function (...a) {
      const p = fn.apply(this, a);
      if (Date.now() - tapAt > 1500 || (skip && skip(...a))) return p;
      return track(p);
    };
  }
  /* 버튼째 돌리면 축이 어긋나 꿀렁거리고, 응답이 오는 순간 멈추면 0도로 툭 튄다(개찰알림에서 지적).
     → 안의 svg 만 돌리고, 끝나면 돌던 바퀴를 마저 돈 뒤(animationiteration) 멈춘다. 여러 요청이 겹쳐도 마지막이 끝날 때까지 돈다 */
  function spin(el, p) {
    el = $(el); if (!el) return p;
    const ic = el.querySelector('svg') || el;
    ic.dataset.spinN = (+ic.dataset.spinN || 0) + 1;
    ic.classList.add('ak-spin');
    const off = () => {
      if (--ic.dataset.spinN > 0) return;
      const stop = () => { if (+ic.dataset.spinN <= 0) ic.classList.remove('ak-spin'); };
      ic.addEventListener('animationiteration', stop, { once: true });
      setTimeout(stop, 2600);
    };
    p.then(off, off); return p;
  }
  /* 입력칸이 화면 아래쪽이면 키보드에 가려 누를 수 없었다(개찰알림 설정 탭) → 누르는 동안 아래 여백을 늘리고 그 칸을 가운데로 */
  function keyboardSafe(view = '#sc') {
    const sel = view + ' input,' + view + ' select,' + view + ' textarea';
    document.addEventListener('focusin', e => {
      if (!e.target.matches?.(sel)) return;
      document.body.classList.add('kb');
      setTimeout(() => e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }), 350);
    });
    document.addEventListener('focusout', () => setTimeout(() => { if (!document.activeElement?.matches?.(sel)) document.body.classList.remove('kb'); }, 200));
  }
  function setBusy({ label, emoji } = {}) { if (label) busyLabel = label; if (emoji) busyEmoji = emoji; }

  let toastTm = 0;
  function toast(msg, ms = 2400) {
    let t = $('.ak-toast');
    if (!t) { t = document.createElement('div'); t.className = 'ak-toast'; t.setAttribute('role', 'status'); t.setAttribute('aria-live', 'polite'); document.body.appendChild(t); }
    t.textContent = msg; requestAnimationFrame(() => t.classList.add('on'));
    clearTimeout(toastTm); toastTm = setTimeout(() => t.classList.remove('on'), ms);
  }

  /* ── 3. 스와이프 ──
     · 세로 스크롤과 헷갈리지 않게: 가로 이동이 세로의 1.5배 이상, 60px 이상, 0.7초 이내일 때만.
     · 가로로 스크롤되는 영역·입력칸·지도·[data-noswipe] 안에서 시작하면 무시.
     · 화면 왼쪽 끝 24px 에서 시작하면 무시 (사파리 뒤로 가기 동작과 겹침). */
  function hScrollable(n, stop) {
    for (; n && n !== stop && n.nodeType === 1; n = n.parentElement) {
      if (n.matches('[data-noswipe],input,textarea,select,.ak-hscroll,.leaflet-container,canvas')) return true;
      if (n.scrollWidth > n.clientWidth + 4 && /(auto|scroll)/.test(getComputedStyle(n).overflowX)) return true;
    }
    return false;
  }
  function swipe(el, { onNext, onPrev, min = 60 } = {}) {
    el = $(el); let x0 = null, y0 = 0, t0 = 0;
    el.addEventListener('touchstart', e => {
      x0 = null; if (e.touches.length !== 1) return;
      const t = e.touches[0]; if (t.clientX < 24 || hScrollable(e.target, el)) return;
      x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
    }, { passive: true });
    el.addEventListener('touchend', e => {
      if (x0 == null) return; const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
      if (Math.abs(dx) < min || Math.abs(dx) < Math.abs(dy) * 1.5 || Date.now() - t0 > 700) return;
      (dx < 0 ? onNext : onPrev)?.();
    }, { passive: true });
    el.addEventListener('touchcancel', () => { x0 = null; }, { passive: true });
  }
  /* 탭바(.ak-tabs button[data-tab]) + 내용(render) + 스와이프를 한 번에 연결 */
  function tabs({ bar = '.ak-tabs', view = '#sc', ids, start, render, remember = 'ak-tab' }) {
    bar = $(bar); view = $(view);
    let cur = start || ids[0];
    try { const s = localStorage.getItem(remember); if (remember && ids.includes(s)) cur = s; } catch (e) {}
    function go(id, dir) {
      if (!ids.includes(id)) return;
      if (dir == null) dir = Math.sign(ids.indexOf(id) - ids.indexOf(cur));
      cur = id; try { remember && localStorage.setItem(remember, id); } catch (e) {}
      bar?.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === id));

let api = async (action, payload = {}) => {
  if (S.demo) { await new Promise(r => setTimeout(r, 450)); return demoApi(action, payload); }
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 60000);
  try {
    const r = await fetch(S.api, { method: 'POST', signal: ctl.signal, headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, auth: LS.get('auth', null), meta: AppKit.device(), ...payload }) });
    if (!r.ok) throw new Error('서버가 응답하지 않았어요 (' + r.status + ')');
    const j = await r.json();
    if (!j.ok) { if (j.code === 'auth' || j.code === 'pending') gateFor(j.code, j.message); throw Object.assign(new Error(j.message || '처리하지 못했어요'), { code: j.code }); }
    return j.data;
  } catch (e) { if (e.name === 'AbortError') throw new Error('서버 응답이 너무 늦어요. 잠시 후 다시 해주세요.'); throw e; }
  finally { clearTimeout(t); }
};
api = AppKit.wrap(api, a => a === 'load' || a === 'img');
let demoDb = null;
function demoApi(action, p) {
  if (!demoDb) demoDb = JSON.parse(JSON.stringify(DEMO));
  const D = demoDb;
  if (action === 'checkin') D.visits.push({ id: 'v' + Date.now(), user: D.me, mt: p.mt, date: p.verified ? AppKit.kstDate() : (p.date || AppKit.kstDate()), verified: p.verified, nights: 0 });
  if (action === 'photo') D.photos.unshift({ id: 'p' + Date.now(), user: D.me, mt: p.mt, date: AppKit.kstDate(), src: p.data });
  if (action === 'addMt' && p.id) { const m = D.mountains.find(x => x.id === p.id); m.lat = p.mt.lat; m.lon = p.mt.lon; return JSON.parse(JSON.stringify(D)); }
  if (action === 'delPhoto') D.photos = D.photos.filter(x => x.id !== p.id);
  if (action === 'check') { const t = D.trips.find(x => x.id === p.trip); const a = t.check[D.me] = t.check[D.me] || []; const i = a.indexOf(p.item); p.on ? i < 0 && a.push(p.item) : i >= 0 && a.splice(i, 1); }
  if (action === 'gear') { const t = D.trips.find(x => x.id === p.trip); t.gear[p.item] = p.who; }
  if (action === 'trip') D.trips.unshift({ id: 't' + Date.now(), ...p.trip, gear: {}, check: {} });
  if (action === 'approve' || action === 'reject') D.admin.pending = D.admin.pending.filter(x => x.id !== p.id);
  if (action === 'setting') D.radius = p.radius;
  if (action === 'template') D[p.kind === 'car' ? 'carTemplate' : 'template'] = p.template;
  if (action === 'addCar') { const c = p.car, id = 'c' + Date.now(); D.carspots.push({ ...c, id, region: '직접 추가', by: D.me, logs: c.date ? [{ id: 'l' + Date.now(), user: D.me, date: c.date, nights: c.nights || 1, score: c.score || 0, note: '' }] : [] }); }
  if (action === 'carLog') D.carspots.find(x => x.id === p.spot).logs.push({ id: 'l' + Date.now(), user: D.me, date: p.date, nights: p.nights, score: p.score, note: p.note });
  if (action === 'delCarLog') D.carspots.forEach(c => c.logs = c.logs.filter(l => l.id !== p.id));
  if (action === 'delCar') D.carspots = D.carspots.filter(c => c.id !== p.id);
  if (action === 'delTrip') D.trips = D.trips.filter(x => x.id !== p.trip);
  if (action === 'joinTrip') { const t = D.trips.find(x => x.id === p.trip); t.members = p.on ? [...new Set([...t.members, D.me])] : t.members.filter(x => x !== D.me); }
  if (action === 'addMt') D.mountains.push({ id: 'm' + Date.now(), ...p.mt });
  return JSON.parse(JSON.stringify(D));
}

const SCENES = [['#f6c89f', '#8fb6d9', '#5d7a99', '#33475c'], ['#bfe3f7', '#e8f4fb', '#7da1bf', '#3e5a73'], ['#ffd29a', '#f49c7a', '#7a5a7c', '#3a2f4a'],

  if (photoCache[i]) return photoCache[i];
  const c = document.createElement('canvas'); c.width = 600; c.height = 600; const g = c.getContext('2d'), s = SCENES[i % SCENES.length];
  const gr = g.createLinearGradient(0, 0, 0, 600); gr.addColorStop(0, s[0]); gr.addColorStop(.6, s[1]); g.fillStyle = gr; g.fillRect(0, 0, 600, 600);
  if (i === 4) { g.fillStyle = '#fff'; for (let k = 0; k < 70; k++) { g.globalAlpha = Math.random() * .8 + .2; g.fillRect((k * 137) % 600, (k * 71) % 330, 2, 2); } g.globalAlpha = 1; }

  g.drawImage(im, 0, 0); g.fillStyle = '#ffffff'; g.fillRect(0, h, w, band);

  g.fillText(name, pad, h + band * .5);

    <label class="field"><span>비밀번호 (숫자 6자리)</span><input id="gpin" type="password" inputmode="numeric" autocomplete="${join ? 'new-password' : 'current-password'}" maxlength="6"></label>
    <div class="err" id="gerr">${esc(msg || '')}</div><button class="btn" type="button" data-g="${join ? 'join' : 'login'}">${join ? '가입 신청' : '로그인'}</button></div>
    <button class="link" type="button" data-g="${join ? 'tologin' : 'tojoin'}">${join ? '이미 가입했어요 · 로그인' : '처음이에요 · 가입 신청'}</button></div>`;
}
let gBusy = false, gLast = '';
async function gateAct(k) {
  if (k === 'tojoin' || k === 'tologin') return showGate(k === 'tojoin' ? 'join' : 'login');
  if (k === 'out') { LS.del('auth'); return showGate('login'); }
  if (k === 'retry') { gate.hidden = true; return refresh(); }
  const name = document.getElementById('gname').value.trim(), pin = document.getElementById('gpin').value, err = document.getElementById('gerr');
  if (!name) { err.textContent = '이름을 넣어 주세요'; return document.getElementById('gname').focus(); }
  if (!/^\d{6}$/.test(pin)) { err.textContent = '비밀번호는 숫자 6자리예요'; return document.getElementById('gpin').focus(); }
  const btn = gate.querySelector('[data-g="login"],[data-g="join"]'); gBusy = true; btn.disabled = true; btn.textContent = '확인하고 있어요…';
  try {
    const r = await fetch(S.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: k, name, pin, meta: AppKit.device() }) }).then(x => x.json());
    if (!r.ok) throw new Error(r.message);
    LS.set('auth', { token: r.data.token, name: r.data.name }); try { localStorage.removeItem('sandojang-join'); } catch (e) {}
    if (r.data.status === 'pending') return showGate('pending');
    gate.hidden = true; history.replaceState(null, '', location.pathname); await refresh();
  } catch (e) {
    err.textContent = /fetch|Load failed/.test(e.message) ? '서버에 연결하지 못했어요' : e.message;
    const el = document.getElementById('gpin'); el.value = ''; gLast = ''; el.focus();
  } finally { gBusy = false; if (btn.isConnected) { btn.disabled = false; btn.textContent = k === 'join' ? '가입 신청' : '로그인'; } }
}
/* 비밀번호 6자리를 채우면 자동 로그인 (아이폰 자동 채우기는 input 이 안 올 때가 있어 keyup·change·paste 도) */
function pinAuto(e) {
  if (e.target.id !== 'gpin' || S.gate !== 'login') return;
  const el = e.target, v = el.value.replace(/\D/g, '').slice(0, 6); if (v !== el.value) el.value = v;
  if (v.length < 6) { gLast = ''; return; }
  if (gBusy || v === gLast || !document.getElementById('gname').value.trim()) return;
  gLast = v; el.blur(); gateAct('login');
}
['input', 'keyup', 'change'].forEach(t => gate.addEventListener(t, pinAuto));
gate.addEventListener('paste', e => setTimeout(() => pinAuto(e), 0));
gate.addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (b) gateAct(b.dataset.g); });

/* ── 도착 체크: 위치는 판정에만 쓰고, 서버에는 '어느 산·인증 여부·거리(100m 단위)'만 보낸다 ── */
function getPos() {
  return new Promise((ok, no) => {
    if (S.demo) { const m = MT(S.cur || nearest().m.id); return setTimeout(() => ok({ lat: m.lat + .0006, lon: m.lon + .0004, acc: 18 }), 600); }
    if (!navigator.geolocation) return no('이 휴대폰에서는 위치를 쓸 수 없어요.');
    navigator.geolocation.getCurrentPosition(p => ok({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }),
      e => no(e.code === 1 ? 'PERM' : e.code === 3 ? '위치를 찾는 데 너무 오래 걸려요. 하늘이 트인 곳에서 다시 해 주세요.' : '위치를 찾지 못했어요. 잠시 후 다시 해 주세요.'),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });
}
async function checkIn(btn, id) {
  btn.disabled = true; const old = btn.innerHTML; btn.innerHTML = '위치 확인 중…';
  try {
    const pos = await getPos(); LS.set('lastPos', [pos.lat, pos.lon]);
    const R = D().radius || 300;
    if (id && MT(id).lat == null) {   // 좌표가 아직 없는 산(공공데이터에 좌표가 빠졌거나 직접 추가): 지금 위치를 정상으로 저장할지 묻는다
      S.newPos = pos;
      return openMt(id, `<div class="result warn"><b>이 산은 아직 좌표가 없어요</b>지금 정상(야영지)에 있다면 이 위치를 저장해 주세요. 다음부터 모두가 도착 체크할 수 있어요.</div>
        <button class="btn" type="button" data-setpos="${id}" style="margin-bottom:10px">${IC.pin}지금 위치를 ${esc(MT(id).name)} 좌표로 저장</button>`);
    }
    const list = (id ? [MT(id)] : D().mountains.filter(m => m.lat != null)).map(m => ({ m, km: kmOf(pos.lat, pos.lon, m.lat, m.lon) })).sort((a, b) => a.km - b.km);
    if (!list.length) throw new Error('좌표가 있는 산이 없어요');
    const { m, km } = list[0], dist = km * 1000, far = km > 2;
    if (far) {   // 2km 넘게 떨어져 있으면 기록하지 않는다 (집에서 잘못 눌러도 남지 않게)
      const html = `<div class="result warn"><b>산에서 멀리 있어요</b>${id ? '' : '가장 가까운 '}${esc(m.name)}에서 ${km < 10 ? km.toFixed(1) : Math.round(km)}km 떨어져 있어요. 지난 산행이면 아래 '다녀온 날 기록'으로 남겨 주세요.</div>`;
      return openMt(m.id, html);
    }
    const bad = pos.acc > 150, verified = !bad && dist <= R + Math.min(pos.acc, 100);
    let res;
    if (bad) res = `<div class="result warn"><b>위치가 정확하지 않아요 (±${Math.round(pos.acc)}m)</b>실내나 숲 속이면 오차가 커요. 하늘이 보이는 곳에서 한 번 더 눌러 주세요. 지금은 '기록만' 남겼어요.</div>`;
    else if (verified) res = `<div class="result go"><b>인증됐어요! ${esc(m.name)}</b>정상(야영지)에서 ${Math.round(dist)}m 안이에요. ${AppKit.num(m.alt)}m 도착을 기록했어요.</div>`;
    else res = `<div class="result warn"><b>기록만 남겼어요</b>${esc(m.name)}에서 ${dist < 1000 ? Math.round(dist) + 'm' : km.toFixed(1) + 'km'} 떨어져 있어요. ${R}m 안으로 가서 다시 누르면 '인증됨'으로 바뀌어요.</div>`;
    S.data = await api('checkin', { mt: m.id, verified, dist: Math.round(dist / 100) * 100 }); save();
    openMt(m.id, res); tabs.redraw();
  } catch (e) {
    const msg = e === 'PERM' ? `<div class="result stop"><b>위치 권한이 꺼져 있어요</b>아이폰 설정 → 개인정보 보호 및 보안 → 위치 서비스 → Safari 웹 사이트 → '앱을 사용하는 동안'으로 바꾼 뒤 다시 눌러 주세요.</div>`
      : `<div class="result stop"><b>위치를 확인하지 못했어요</b>${esc(e.message || e)}</div>`;
    if (sheet.isOpen && S.cur) openMt(S.cur, msg); else openSheet(msg);
  } finally { btn.disabled = false; btn.innerHTML = old; }
}

  const wanted = () => { const b = LS.get('mapBase', 'kakao'); return BASES[b] ? b : 'kakao'; };
  const base = () => { const b = wanted(); return BASES[b].kakao && kakaoState === 'off' ? 'std' : b; };
  const marks = () => LS.get('seamark', false);
  const z2lv = z => Math.max(1, Math.min(14, Math.round(20 - z)));   // Leaflet 확대 단계 ↔ 카카오 레벨
  const lv2z = lv => 20 - lv;

  /* 카카오 지도 SDK는 처음 필요할 때 한 번만 불러온다. 8초 안에 안 뜨면 Leaflet 으로 바꾼다 */
  function loadKakao() {
    return new Promise(ok => {
      if (kakaoState === 'ready') return ok(true);
      if (kakaoState === 'off') return ok(false);
      kakaoWait.push(ok);
      if (kakaoState === 'loading') return;
      kakaoState = 'loading';
      const done = v => { kakaoState = v ? 'ready' : 'off'; const w = kakaoWait; kakaoWait = []; w.forEach(f => f(v)); if (!v) AppKit.toast('카카오지도를 불러오지 못해 기본 지도로 보여 줘요'); };
      const t = setTimeout(() => done(false), 8000);
      const sc = document.createElement('script');
      sc.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_KEY}&autoload=false`;
      sc.referrerPolicy = 'origin';
      sc.onload = () => { try { kakao.maps.load(() => { clearTimeout(t); done(true); }); } catch (e) { clearTimeout(t); done(false); } };
      sc.onerror = () => { clearTimeout(t); done(false); };
      document.head.append(sc);
    });
  }

  /* 지도 칸 하나 만들기. ready(h) 는 지도가 준비되면 불린다 (카카오는 처음 한 번 비동기) */
  function make(el, opts, ready) {
    el.innerHTML = '<div class="mk-canvas"></div>';
    const canvas = el.firstChild;
    const b = base();
    if (BASES[b].kakao) {
      el.classList.add('mk-wait');
      loadKakao().then(ok => { el.classList.remove('mk-wait'); if (!el.isConnected) return; if (!ok) return make(el, opts, ready); ready(kakaoMap(el, canvas, opts, b)); });
      return;
    }
    if (!L_) { el.innerHTML = '<div class="nomap">지도를 불러오지 못했어요</div>'; return; }
    ready(leafletMap(el, canvas, opts, b));
  }
  function startView(h, { key, fit, pts = [], zoom = 12, center }) {
    if (center) h.view(center[0], center[1], zoom);
    else if (pts.length > 1) h.fit(pts, fit || 11);
    else if (pts.length === 1) h.view(pts[0][0], pts[0][1], 9);
    else h.view(36.0, 127.6, 6.5);   // 지점이 없으면 우리나라 전체
  }

  function leafletMap(el, canvas, o, b) {
    const it = o.interactive !== false;
    const m = L_.map(canvas, { zoomControl: false, attributionControl: true, zoomSnap: .5, minZoom: 5, maxZoom: 18, maxBounds: [[28, 118], [44, 138]],
      dragging: it, scrollWheelZoom: it, touchZoom: it, doubleClickZoom: it, boxZoom: it, keyboard: it });
    m.attributionControl.setPrefix(false);
    const B = BASES[b];
    L_.tileLayer(B.url, { maxZoom: 18, ...B.o }).addTo(m);
    if (B.over) L_.tileLayer(B.over, { maxZoom: 18, maxNativeZoom: 13, opacity: .9 }).addTo(m);
    if (marks()) L_.tileLayer(SEAMARK, { minZoom: 9, maxZoom: 18, opacity: .95 }).addTo(m);
    const h = {
      el, kind: 'leaflet',
      add(lat, lon, html, { onClick, z = 0 } = {}) {
        const mk = L_.marker([lat, lon], { icon: L_.divIcon({ html, className: 'mk', iconSize: [0, 0] }), interactive: !!onClick, zIndexOffset: z }).addTo(m);
        if (onClick) mk.on('click', onClick);
        return { set: (a, c) => mk.setLatLng([a, c]), remove: () => mk.remove() };
      },
      draggable(lat, lon, onEnd) {
        const mk = L_.marker([lat, lon], { draggable: true, icon: L_.divIcon({ html: '<div class="mpin pick"><i></i></div>', className: 'mk', iconSize: [0, 0] }) }).addTo(m);
        mk.on('dragend', () => { const p = mk.getLatLng(); onEnd(p.lat, p.lng); });
        return { set: (a, c) => mk.setLatLng([a, c]), remove: () => mk.remove() };
      },
      onClick(fn) { m.on('click', e => fn(e.latlng.lat, e.latlng.lng)); },
      view(lat, lon, z) { m.setView([lat, lon], z, { animate: false }); },
      zoom: () => m.getZoom(), zoomBy: d => d > 0 ? m.zoomIn() : m.zoomOut(),
      fit(pts, maxZ = 11) { m.fitBounds(L_.latLngBounds(pts), { padding: [20, 20], maxZoom: maxZ, animate: false }); m.setZoom(m.getZoom() - 1, { animate: false }); },
      relayout() { m.invalidateSize(); }, destroy() { m.remove(); },
    };
    startView(h, o);
    setTimeout(() => { if (!el.isConnected || el.dataset.touched || (o.key && views[o.key])) return; m.invalidateSize(); startView(h, o); }, 400);
    if (o.key) { let touched = false; el.addEventListener('pointerdown', () => { touched = true; el.dataset.touched = 1; }); m.on('moveend', () => { if (!touched) return; const c = m.getCenter(); views[o.key] = { lat: c.lat, lon: c.lng, z: m.getZoom() }; }); }
    finish(h, o);
    return h;
  }

  function kakaoMap(el, canvas, o, b) {
    const K = kakao.maps, it = o.interactive !== false;
    const m = new K.Map(canvas, { center: new K.LatLng(36, 127.8), level: 12, draggable: it, scrollwheel: it, disableDoubleClickZoom: !it });
    m.setMapTypeId(K.MapTypeId[BASES[b].kakao]);
    if (!it) m.setZoomable(false);
    m.setMinLevel?.(1); m.setMaxLevel?.(14);
    const overlay = (lat, lon, html, onClick, z) => {
      const box = document.createElement('div'); box.className = 'mk'; box.style.cssText = 'position:relative;width:0;height:0'; box.innerHTML = html;
      if (onClick) { box.style.cursor = 'pointer'; box.firstElementChild?.addEventListener('click', e => { e.stopPropagation(); onClick(); }); }
      else box.firstElementChild && (box.firstElementChild.style.pointerEvents = 'none');
      const ov = new K.CustomOverlay({ position: new K.LatLng(lat, lon), content: box, xAnchor: 0, yAnchor: 0, zIndex: 3 + (z || 0) / 100, clickable: !!onClick });
      ov.setMap(m);
      return { set: (a, c) => ov.setPosition(new K.LatLng(a, c)), remove: () => ov.setMap(null) };
    };
    const PICK = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30"><circle cx="15" cy="15" r="11" fill="#007ab5" stroke="#fff" stroke-width="4"/></svg>');
    const h = {
      el, kind: 'kakao',
      add(lat, lon, html, { onClick, z = 0 } = {}) { return overlay(lat, lon, html, onClick, z); },
      draggable(lat, lon, onEnd) {
        const mk = new K.Marker({ position: new K.LatLng(lat, lon), draggable: true, image: new K.MarkerImage(PICK, new K.Size(30, 30), { offset: new K.Point(15, 15) }) });
        mk.setMap(m);
        K.event.addListener(mk, 'dragend', () => { const p = mk.getPosition(); onEnd(p.getLat(), p.getLng()); });
        return { set: (a, c) => mk.setPosition(new K.LatLng(a, c)), remove: () => mk.setMap(null) };
      },
      onClick(fn) { K.event.addListener(m, 'click', e => fn(e.latLng.getLat(), e.latLng.getLng())); },
      view(lat, lon, z) { m.setLevel(z2lv(z)); m.setCenter(new K.LatLng(lat, lon)); },
      zoom: () => lv2z(m.getLevel()), zoomBy: d => m.setLevel(m.getLevel() - d, { animate: true }),
      // 모든 지점이 들어오게 맞춘 뒤 한 단계 더 넓게, 가운데는 지점들의 한가운데로 (한쪽으로 쏠리지 않게)
      fit(pts) { const bd = new K.LatLngBounds(); pts.forEach(p => bd.extend(new K.LatLng(p[0], p[1]))); m.setBounds(bd, 20, 20, 20, 20);
        m.setLevel(Math.min(14, m.getLevel() + 1)); m.setCenter(new K.LatLng((Math.min(...pts.map(p => p[0])) + Math.max(...pts.map(p => p[0]))) / 2, (Math.min(...pts.map(p => p[1])) + Math.max(...pts.map(p => p[1]))) / 2)); },
      relayout() { const c = m.getCenter(); m.relayout(); m.setCenter(c); }, destroy() {},
    };
    startView(h, o);
    setTimeout(() => { if (!el.isConnected || el.dataset.touched || (o.key && views[o.key])) return; m.relayout(); startView(h, o); }, 400);
    if (o.key) { let touched = false; el.addEventListener('pointerdown', () => { touched = true; el.dataset.touched = 1; }); K.event.addListener(m, 'idle', () => { if (!touched) return; const c = m.getCenter(); views[o.key] = { lat: c.getLat(), lon: c.getLng(), z: lv2z(m.getLevel()) }; }); }
    finish(h, o);
    return h;
  }

  /* 오른쪽 위 버튼: 확대·축소 · 전체 보기 · 내 위치 · 바탕 바꾸기 (두 지도 공통) */
  function finish(h, o) {
    live.add(h);
    if (o.controls === false) return;
    const d = document.createElement('div'); d.className = 'mk-tools';
    d.innerHTML = `<button type="button" data-mk="plus" aria-label="확대">＋</button><button type="button" data-mk="minus" aria-label="축소">－</button>
      <button type="button" data-mk="all" aria-label="전체 보기"><svg class="ak-ic" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button type="button" data-mk="me" aria-label="내 위치"><svg class="ak-ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg></button>
      <button type="button" data-mk="base" class="txt">${BASES[base()].name}</button>`;
    d.addEventListener('click', e => {
      const k = e.target.closest('[data-mk]')?.dataset.mk; if (!k) return; e.stopPropagation();
      if (k === 'plus') h.zoomBy(1); if (k === 'minus') h.zoomBy(-1);
      if (k === 'all') { if (o.key) delete views[o.key]; delete h.el.dataset.touched; const p = o.pts || []; p.length > 1 ? h.fit(p) : p.length ? h.view(p[0][0], p[0][1], 9) : h.view(35.9, 127.8, 6.5); }
      if (k === 'me') myPos().then(p => { h.view(p[0], p[1], Math.max(h.zoom(), 12)); h.add(p[0], p[1], '<div class="medot"></div>'); }, err => AppKit.toast(err));
      if (k === 'base') { const ks = Object.keys(BASES), n = ks[(ks.indexOf(base()) + 1) % ks.length]; LS.set('mapBase', n); AppKit.toast(BASES[n].name + ' 지도로 바꿨어요'); remount(); }
    });
    h.el.append(d);
  }
  /* 내 위치: 화면에서 지도를 옮기는 데만 쓰고 서버에는 보내지 않는다 */
  const myPos = () => new Promise((ok, no) => {
    if (!navigator.geolocation) return no('이 기기에서는 위치를 쓸 수 없어요');
    navigator.geolocation.getCurrentPosition(p => ok([p.coords.latitude, p.coords.longitude]), () => no('위치 권한을 허용해 주세요'), { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  });
  function clear(root) { live.forEach(h => { if (!root || root.contains(h.el)) { h.destroy(); live.delete(h); } }); }
  const inside = root => [...live].filter(h => root.contains(h.el));
  let remount = () => {};
  return { make, clear, inside, myPos, setKey, setRemount: f => remount = f, BASES, get base() { return wanted(); }, views };
})();

  } catch (e) {
    document.getElementById('dot').className = 'ak-dot off';
    document.getElementById('st').textContent = S.lastOk ? AppKit.hhmm(S.lastOk) + ' 이후 연결 안 됨' : '연결 안 됨';
    AppKit.toast(/fetch|Load failed/.test(e.message) ? '서버에 연결하지 못했어요. 잠시 후 다시 해주세요.' : e.message);
  }
}
AppKit.poll(refresh, 60000, () => sheet.isOpen || !gate.hidden);
if (!S.demo && !LS.get('auth', null)) showGate(localStorage.getItem('sandojang-join') ? 'join' : 'login');
if (S.data) AppKit.bootDone();
if (S.demo || LS.get('auth', null)) refresh().finally(AppKit.bootDone);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
